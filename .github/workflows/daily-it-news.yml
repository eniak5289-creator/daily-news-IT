name: Daily IT News

on:
  schedule:
    # UTC 23:47 = KST 08:47 (한국 시간 아침 8시 47분 실행)
    - cron: "47 23 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-it-news
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          
      - run: pip install -r requirements.txt
      
      - name: Collect, export, and email
        env:
          TZ: Asia/Seoul
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_RECV: ${{ secrets.EMAIL_RECV }}
          LOOKBACK_HOURS: "36"
          MAX_PER_FEED: "30"
          SEND_EMAIL: "true"
        run: python daily_it_news.py
        
      # 주의: 용량 초과(Repository access blocked)의 원인이었던 
      # actions/upload-artifact 단계는 서버 용량 확보를 위해 제거했습니다.

      # 60일 저장소 비활동으로 인한 GitHub Actions 스케줄러 자동 중지 방지
      - name: Keepalive Workflow
        uses: gautamkrishnar/keepalive-workflow@v2
        if: always()
