name: Daily IT News
on:
  schedule:
    - cron: "10 22 * * *" # 매일 KST 07:10
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: daily-it-news
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Collect, export, and email
        env:
          TZ: Asia/Seoul
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_RECV: ${{ secrets.EMAIL_RECV }}
          LOOKBACK_HOURS: "36"
          MAX_PER_FEED: "30"
          SEND_EMAIL: "true"
        run: python daily_it_news.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: daily-it-news-${{ github.run_id }}
          path: output/
          if-no-files-found: warn
          retention-days: 14
